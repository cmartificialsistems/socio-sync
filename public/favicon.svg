<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E05A47" />
      <stop offset="100%" stop-color="#B83A28" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#F4A261" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Outer Ring Accent -->
  <rect x="48" y="48" width="416" height="416" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8" />

  <!-- Partner Interlocking S-Sync Emblem -->
  <!-- Partner A Arc (Left Top to Center) -->
  <path d="M 160 210 C 160 150, 230 140, 280 170 C 330 200, 350 250, 310 300 C 280 340, 220 350, 180 320" 
        fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Partner B Arc (Right Bottom to Center Interlock) -->
  <path d="M 352 302 C 352 362, 282 372, 232 342 C 182 312, 162 262, 202 212 C 232 172, 292 162, 332 192" 
        fill="none" stroke="url(#glowGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Core Sync Dots -->
  <circle cx="160" cy="210" r="24" fill="#FFFFFF" />
  <circle cx="352" cy="302" r="24" fill="#FFD166" />
</svg>
